async function loginStaff(){
  const l=document.getElementById('li').value.trim();
  const p=document.getElementById('lp').value.trim();
  const al=document.getElementById('la');

  al.innerHTML=`<div class="alert" style="background:rgba(255,255,255,0.05);color:#aaa;">⏳ Connexion en cours...</div>`;
  try {
    const{data,error}=await sb.from('users').select('*').eq('login',l).in('role',['admin','moderateur']);

    if(!data||data.length===0){al.innerHTML=`<div class="alert alert-error">❌ Identifiant introuvable.</div>`;return;}

    al.innerHTML=`<div class="alert alert-error">❌ Erreur : ${e.message||'Vérifiez votre connexion.'}</div>`;
  }
}

    al.innerHTML=`<div class="alert alert-error">❌ Erreur : ${e.message||'Vérifiez votre connexion.'}</div>`;
  }
}

async function doRegister(){
  const p=document.getElementById('rp').value.trim(),n=document.getElementById('rn').value.trim(),t=document.getElementById('rt').value.trim(),a=document.getElementById('ra').value.trim(),rcVal=document.getElementById('rc').value.trim(),pw=document.getElementById('rpw').value.trim();const c=rcVal?'UP-'+String(parseInt(rcVal)).padStart(3,'0'):'';
  const al=document.getElementById('la');
  if(!p||!n||!t||!a||!c||!pw){al.innerHTML=`<div class="alert alert-error">Tous les champs sont requis.</div>`;return;}
  const{data:ex}=await sb.from('users').select('id').eq('num_carte',c).maybeSingle();
  if(ex){al.innerHTML=`<div class="alert alert-error">Ce numéro de carte est déjà utilisé.</div>`;return;}
  const{error}=await sb.from('users').insert({role:'client',login:c,password:pw,prenom:p,nom:n,telephone:t,adresse:a,num_carte:c,points:0});
  if(error){al.innerHTML=`<div class="alert alert-error">Erreur : ${error.message}</div>`;return;}
  al.innerHTML=`<div class="alert alert-success">Compte créé ! Connectez-vous avec votre numéro de carte.</div>`;
  setTimeout(()=>switchTab('client'),2000);
}

function openSearch(){
  const modal=document.getElementById('search-modal');
  modal.style.display='flex';
  const inp=document.getElementById('search-input');
  inp.value='';doSearch('');
  setTimeout(()=>inp.focus(),150);
}
function closeSearch(){document.getElementById('search-modal').style.display='none';}

function doSearch(q){
  const query=q.toLowerCase().trim();
  const res=query?allClients.filter(c=>(c.prenom+' '+c.nom+' '+(c.num_carte||'')+' '+(c.telephone||'')).toLowerCase().includes(query)):allClients.slice(0,8);
  const cont=document.getElementById('search-results');
  if(!cont)return;
  if(res.length===0){cont.innerHTML=`<div style="text-align:center;padding:1.5rem;color:#9ca3af;font-size:13px;">Aucun client trouvé${query?' pour "'+q+'"':''}.</div>`;return;}
  cont.innerHTML=res.map(c=>`
    <div class="search-item" onclick="pickClient('${c.id}')">
      <div class="avatar" style="${avStyle('client')}">${ini(c.prenom,c.nom)}</div>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">${c.prenom} ${c.nom}</div>
        <div style="font-size:12px;color:#9ca3af;">${c.num_carte||'—'} · ${c.telephone||'—'} · <b style="color:var(--brand);">${c.points} pts</b></div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>`).join('');
}

async function renderHistory(){
  const{data:clients}=await sb.from('users').select('*').eq('role','client');
  let q=sb.from('transactions').select('*,client:client_id(id,prenom,nom,num_carte),by:by_user_id(prenom,nom,role)').order('created_at',{ascending:false});
  if(histFilters.clientId)q=q.eq('client_id',histFilters.clientId);
  if(histFilters.dateFrom)q=q.gte('created_at',histFilters.dateFrom+'T00:00:00');
  if(histFilters.dateTo)q=q.lte('created_at',histFilters.dateTo+'T23:59:59');
  if(histFilters.type==='add')q=q.gt('points',0);
  if(histFilters.type==='redeem')q=q.lt('points',0);
  const{data:txs}=await q;
  const all=txs||[];
  const tp=all.filter(t=>t.points>0).reduce((s,t)=>s+t.points,0);
  const tr2=all.filter(t=>t.points<0).length;
  const grouped=groupDate(all);
  const hasF=histFilters.clientId||histFilters.dateFrom||histFilters.dateTo||histFilters.type;
  let cOpts=`<option value="">Tous les clients</option>`;
  (clients||[]).forEach(c=>cOpts+=`<option value="${c.id}" ${histFilters.clientId===c.id?'selected':''}>${c.prenom} ${c.nom} (${c.num_carte})</option>`);
  let histHTML='';
  Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const rows=grouped[date];
    const dp=rows.filter(r=>r.points>0).reduce((s,r)=>s+r.points,0);
    histHTML+=`<div class="date-group"><span>${fmtDateLong(date)}</span><span style="font-size:11px;font-weight:400;color:#9ca3af;">${rows.length} tx${dp?' · +'+dp+' pts':''}</span></div>`;
    rows.forEach(h=>{
      const cn=h.client?`${h.client.prenom} ${h.client.nom}`:'—';
      const cnum=h.client?.num_carte||'—';
      const by=h.by?`${h.by.prenom||''} ${h.by.nom||''}`.trim():'—';
      const role=h.by?.role==='admin'?' (Admin)':h.by?.role==='moderateur'?' (Modérateur)':'';
      const isAdd=h.points>0;
      histHTML+=`<div class="history-row">
        ${!histFilters.clientId?`<span style="font-weight:700;color:var(--brand);min-width:65px;font-size:12px;">${cnum}</span><div style="flex:1;"><span style="font-weight:500;">${cn}</span> — ${h.label}<div style="font-size:11px;color:#9ca3af;">${fmtTime(h.created_at)} · par <b>${by}</b>${role}</div></div>`:`<div style="flex:1;">${h.label}<div style="font-size:11px;color:#9ca3af;">${fmtTime(h.created_at)} · par <b>${by}</b>${role}</div></div>`}
        <span class="${isAdd?'pts-pos':'pts-neg'}" style="font-weight:700;">${isAdd?'+':''}${h.points}</span>
      </div>`;
    });
  });
  if(!histHTML)histHTML=`<div style="text-align:center;padding:2rem;font-size:13px;color:#6b7280;">Aucune transaction.</div>`;
  return `
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num">${(clients||[]).length}</div><div class="stat-lbl">Clients</div></div>
    <div class="stat-box"><div class="stat-num">${tp}</div><div class="stat-lbl">Points${hasF?' (filtrés)':''}</div></div>
    <div class="stat-box"><div class="stat-num">${tr2}</div><div class="stat-lbl">Récompenses</div></div>
  </div>
  <div class="card">
    <div class="section-title">Filtres</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div class="field" style="margin:0;"><label>Client</label><select onchange="histFilters.clientId=this.value;showStaff()">${cOpts}</select></div>
      <div class="field" style="margin:0;"><label>Type</label><select onchange="histFilters.type=this.value;showStaff()"><option value="" ${!histFilters.type?'selected':''}>Tous</option><option value="add" ${histFilters.type==='add'?'selected':''}>Points ajoutés</option><option value="redeem" ${histFilters.type==='redeem'?'selected':''}>Récompenses</option></select></div>
      <div class="field" style="margin:0;"><label>Du</label><input type="date" value="${histFilters.dateFrom}" onchange="histFilters.dateFrom=this.value;showStaff()"/></div>
      <div class="field" style="margin:0;"><label>Au</label><input type="date" value="${histFilters.dateTo}" onchange="histFilters.dateTo=this.value;showStaff()"/></div>
    </div>
    ${hasF?`<button class="btn btn-sm" onclick="histFilters={clientId:'',dateFrom:'',dateTo:'',type:''};showStaff()">✕ Réinitialiser</button>`:''}
  </div>
  <div class="card"><div class="section-title">${all.length} transaction(s)</div>${histHTML}</div>`;
}

      <div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:1.5rem;">
        <div class="avatar avatar-lg" style="${avStyle('client')}">${ini(c.prenom,c.nom)}</div>
        <div style="text-align:left;"><div style="font-size:18px;font-weight:700;">${c.prenom} ${c.nom}</div><div style="font-size:13px;color:#6b7280;">Carte <b style="color:var(--brand);">${c.num_carte}</b></div><div style="font-size:12px;color:#6b7280;">${c.telephone||''}</div></div>
      </div>
      <div class="pts-big">${c.points}</div>
      <div style="font-size:14px;color:#6b7280;margin-top:6px;">points cumulés · 1€ = 1 point</div>
    </div>
    <div class="card">
      <div class="section-title">Mes récompenses</div>
      <div class="reward-row${c.points>=125?' unlocked':''}">
        <div class="reward-icon">🍾</div>
        <div style="flex:1;"><div style="font-weight:600;font-size:14px;">Bouteille 1.5L offerte</div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${Math.min(100,(c.points/125)*100)}%"></div></div>
        <div style="font-size:12px;color:#6b7280;">${p1}/125 pts</div></div>
        ${c.points>=125?`<span class="badge badge-admin">Disponible !</span>`:''}
      </div>
      <div class="reward-row${c.points>=250?' unlocked':''}">
        <div class="reward-icon">🍕</div>
        <div style="flex:1;"><div style="font-weight:600;font-size:14px;">Pizza Junior au choix offerte</div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${Math.min(100,(c.points/250)*100)}%"></div></div>
        <div style="font-size:12px;color:#6b7280;">${p2}/250 pts</div></div>
        ${c.points>=250?`<span class="badge badge-admin">Disponible !</span>`:''}
      </div>
    </div>
    <div class="card"><div class="section-title">Mon historique</div>${histHTML}</div>
  </div>`);
}

// ========================
// ACTIONS
// ========================
function toggleEditClient(id){
  const form=document.getElementById('edit-form-'+id);
  if(form)form.style.display=form.style.display==='none'?'block':'none';
}

async function saveClient(id){
  const prenom=document.getElementById('ef-prenom').value.trim();
  const nom=document.getElementById('ef-nom').value.trim();
  const tel=document.getElementById('ef-tel').value.trim();
  const adr=document.getElementById('ef-adr').value.trim();
  const numVal=document.getElementById('ef-num').value.trim();
  const pass=document.getElementById('ef-pass').value.trim();
  if(!prenom||!nom){toast('Prénom et nom requis');return;}
  const num_carte=numVal?'UP-'+String(parseInt(numVal)).padStart(3,'0'):null;
  const updates={prenom,nom,telephone:tel,adresse:adr};
  if(num_carte)updates.num_carte=num_carte;
  if(num_carte)updates.login=num_carte;
  if(pass)updates.password=pass;
  const{error}=await sb.from('users').update(updates).eq('id',id);
  if(error){toast('Erreur : '+error.message);return;}
  toast('✅ Client mis à jour !');
  await loadClients();
  showStaff();
}

async function createClient(num){
  const p=document.getElementById('ac-p').value.trim(),n=document.getElementById('ac-n').value.trim();
  const t=document.getElementById('ac-t').value.trim(),a=document.getElementById('ac-a').value.trim();
  const pw=document.getElementById('ac-pw').value.trim()||num;
  if(!p||!n){toast('Prénom et nom requis');return;}
  const{error}=await sb.from('users').insert({role:'client',login:num,password:pw,prenom:p,nom:n,telephone:t,adresse:a,num_carte:num,points:0});
  if(error){toast('Erreur : '+error.message);return;}
  toast(`✅ ${p} ${n} créé — carte ${num}`);showCreateClient=false;await loadClients();showStaff();
}

async function deleteClient(id){
  if(!confirm('Supprimer ce client ?'))return;
  await sb.from('transactions').delete().eq('client_id',id);
  await sb.from('users').delete().eq('id',id);
  if(selectedClientId===id)selectedClientId=null;
  toast('Client supprimé');await loadClients();showStaff();
}

async function addPoints(clientId){
  const val=parseInt(document.getElementById('pts-in').value);
  if(!val||val<1){toast('Montant invalide');return;}
  if(session.role==='moderateur'&&!isOpen()){toast('❌ Restaurant fermé — ajout impossible.',4000);return;}
  const{data:c}=await sb.from('users').select('points').eq('id',clientId).single();
  await sb.from('users').update({points:(c.points||0)+val}).eq('id',clientId);
  await sb.from('transactions').insert({client_id:clientId,by_user_id:session.id,label:`Commande ${val}€`,points:val});
  toast(`+${val} points ajoutés !`);await loadClients();showStaff();
}

async function redeemReward(clientId,cost,label){
  if(!confirm(`Utiliser "${label}" ?`))return;
  const{data:c}=await sb.from('users').select('points').eq('id',clientId).single();
  if(c.points<cost){toast('Points insuffisants');return;}
  await sb.from('users').update({points:c.points-cost}).eq('id',clientId);
  await sb.from('transactions').insert({client_id:clientId,by_user_id:session.id,label,points:-cost});
  toast(`${label} utilisé !`);await loadClients();showStaff();
}

async function createMod(){
  const p=document.getElementById('am-p').value.trim(),n=document.getElementById('am-n').value.trim();
  const l=document.getElementById('am-l').value.trim(),pw=document.getElementById('am-pw').value.trim();
  if(!p||!n||!l||!pw){toast('Tous les champs requis');return;}
  const{error}=await sb.from('users').insert({role:'moderateur',login:l,password:pw,prenom:p,nom:n});
  if(error){toast('Erreur : '+error.message);return;}
  toast(`Modérateur ${p} ${n} créé`);showCreateMod=false;showStaff();
}

async function deleteMod(id){
  if(!confirm('Supprimer ce modérateur ?'))return;
  await sb.from('users').delete().eq('id',id);
  toast('Modérateur supprimé');showStaff();
}

showLogin();
