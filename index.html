  document.querySelectorAll('.lta').forEach(b=>b.classList.remove('active'));

  const b=document.getElementById('lbody');
  if(tab==='s'){
    b.innerHTML=`<div id="la"></div>
    <div class="field"><label>Identifiant</label><input id="li" autocorrect="off" autocapitalize="off" placeholder="admin"/></div>
    <div class="field"><label>Mot de passe</label><input id="lp" type="password" placeholder="••••••"/></div>
    <button class="btn bp bf" onclick="window.doLS()">Se connecter</button>`;
    document.getElementById('li').addEventListener('keydown',e=>{if(e.key==='Enter')doLS();});
    document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLS();});
  } else if(tab==='c'){
    b.innerHTML=`<div id="la"></div>
    <div class="field"><label>Numéro de carte</label><input id="li" type="number" placeholder="Ex: 2820" autocorrect="off"/></div>

    <div class="field"><label>Adresse</label><input id="ra"/></div>
    <div class="field"><label>Numéro de carte</label><input id="rc" type="number" min="1" placeholder="Ex: 2820"/>
      <div style="font-size:12px;color:rgba(255,255,255,0.3);margin-top:6px;">⚠️ Ce numéro sera aussi votre mot de passe.</div>

}

async function doLS(){
  const l=document.getElementById('li').value.trim(),p=document.getElementById('lp').value.trim();
  const al=document.getElementById('la');
  if(!l||!p){al.innerHTML=`<div class="al ae">Veuillez remplir tous les champs.</div>`;return;}
  al.innerHTML=`<div class="al ai">⏳ Connexion en cours...</div>`;
  try{
    const{data,error}=await sb.from('users').select('*').eq('login',l).in('role',['admin','moderateur']);
    if(error)throw error;
    if(!data||data.length===0){al.innerHTML=`<div class="al ae">❌ Identifiant introuvable.</div>`;return;}
    const user=data.find(u=>u.password===p);
    if(!user){al.innerHTML=`<div class="al ae">❌ Mot de passe incorrect.</div>`;return;}
    session=user;resetT();document.body.classList.add('staff-mode');await loadCl();showStaff();openSM();
  }catch(e){al.innerHTML=`<div class="al ae">❌ Erreur : ${e.message}</div>`;}
}

async function doLC(){
  const raw=document.getElementById('li').value.trim(),p=document.getElementById('lp').value.trim();
  const al=document.getElementById('la');
  if(!raw||!p){al.innerHTML=`<div class="al ae">Veuillez remplir tous les champs.</div>`;return;}
  al.innerHTML=`<div class="al ai">⏳ Connexion en cours...</div>`;
  try{
    const fmts=[raw,'UP-'+raw,'UP-'+String(parseInt(raw)).padStart(3,'0'),parseInt(raw).toString()];
    let user=null;
    for(const fmt of fmts){
      const{data}=await sb.from('users').select('*').eq('num_carte',fmt).eq('role','client');
      if(data&&data.length>0){
        const pwFmts=[p,'UP-'+p,'UP-'+String(parseInt(p)).padStart(3,'0'),parseInt(p).toString(),fmt];
        user=data.find(u=>pwFmts.includes(u.password));
        if(user)break;
        al.innerHTML=`<div class="al ae">❌ Mot de passe incorrect.</div>`;return;
      }
    }
    if(!user){al.innerHTML=`<div class="al ae">❌ Numéro de carte introuvable.</div>`;return;}
    session=user;resetT();document.body.classList.remove('staff-mode');showCS();
  }catch(e){al.innerHTML=`<div class="al ae">❌ Erreur : ${e.message}</div>`;}
}

async function doReg(){
  const p=document.getElementById('rp').value.trim(),n=document.getElementById('rn').value.trim();
  const t=document.getElementById('rt').value.trim(),a=document.getElementById('ra').value.trim();
  const cv=document.getElementById('rc').value.trim();
  const al=document.getElementById('la');
  if(!p||!n||!t||!a||!cv){al.innerHTML=`<div class="al ae">Tous les champs sont requis.</div>`;return;}
  const nc=parseInt(cv).toString();
  const{data:ex}=await sb.from('users').select('id').eq('num_carte',nc).maybeSingle();
  if(ex){al.innerHTML=`<div class="al ae">Ce numéro de carte est déjà utilisé.</div>`;return;}
  const{error}=await sb.from('users').insert({role:'client',login:nc,password:nc,prenom:p,nom:n,telephone:t,adresse:a,num_carte:nc,points:0,reward1_used:false,reward2_used:false});
  if(error){al.innerHTML=`<div class="al ae">Erreur : ${error.message}</div>`;return;}
  al.innerHTML=`<div class="al as2">✅ Compte créé ! Connectez-vous avec votre numéro de carte.</div>`;
  setTimeout(()=>switchTab('c'),2000);
}

async function rDet(isA){

  if(!c)return'';
  const{data:allTxs}=await sb.from('transactions').select('*,by:by_user_id(prenom,nom,role)').eq('client_id',selId).order('created_at',{ascending:false});
  const txs=(allTxs||[]).slice(0,txPage);
  const hasMore=(allTxs||[]).length>txPage;
  const p1=Math.min(c.points,125),p2=Math.min(c.points,250);
  const gd=grp(txs);
  const mois=monthsAgo(c.created_at||new Date().toISOString());
  const isVip=c.points>=250||(allTxs||[]).filter(t=>t.points<0).length>=2;

  // Next reward

// HISTORY
async function rHist(){
  const{data:cl2}=await sb.from('users').select('*').eq('role','client');
  let q=sb.from('transactions').select('*,client:client_id(id,prenom,nom,num_carte),by:by_user_id(prenom,nom,role)').order('created_at',{ascending:false});
  if(hf.cid)q=q.eq('client_id',hf.cid);
  if(hf.df)q=q.gte('created_at',hf.df+'T00:00:00');
  if(hf.dt)q=q.lte('created_at',hf.dt+'T23:59:59');
  if(hf.type==='add')q=q.gt('points',0);
  if(hf.type==='redeem')q=q.lt('points',0);
  const{data:txs}=await q;
  const all=txs||[];
  const tp=all.filter(t=>t.points>0).reduce((s,t)=>s+t.points,0);
  const tr2=all.filter(t=>t.points<0).length;
  const hasF=hf.cid||hf.df||hf.dt||hf.type;
  let cO=`<option value="">Tous les clients</option>`;
  (cl2||[]).forEach(c=>cO+=`<option value="${c.id}" ${hf.cid===c.id?'selected':''}>${c.prenom} ${c.nom} (${c.num_carte})</option>`);
  const gd=grp(all);
  let hH='';
  Object.keys(gd).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const rows=gd[date],dp=rows.filter(r=>r.points>0).reduce((s,r)=>s+r.points,0);
    hH+=`<div class="dg"><span>${fmtL(date)}</span><span style="font-size:11px;font-weight:400;">${rows.length} tx${dp?' · +'+dp+' pts':''}</span></div>`;
    rows.forEach(h=>{
      const cn=h.client?`${h.client.prenom} ${h.client.nom}`:'—';
      const cnum=h.client?.num_carte||'—';
      const by=h.by?`${h.by.prenom||''} ${h.by.nom||''}`.trim():'—';
      const rl=h.by?.role==='admin'?' (Admin)':h.by?.role==='moderateur'?' (Modérateur)':'';
      const ia=h.points>0;
      hH+=`<div class="hr2">
        ${!hf.cid?`<span style="font-weight:700;color:var(--gold);min-width:55px;font-size:12px;">${cnum}</span>
        <div style="flex:1;"><span style="font-weight:500;">${cn}</span> — ${h.label}
        <div style="font-size:11px;color:#888;">${fmtT(h.created_at)} · par <b>${by}</b>${rl}</div></div>`
        :`<div style="flex:1;">${h.label}<div style="font-size:11px;color:#888;">${fmtT(h.created_at)} · par <b>${by}</b>${rl}</div></div>`}
        <span class="${ia?'pp':'pn'}" style="font-weight:700;">${ia?'+':''}${h.points}</span>
      </div>`;
    });
  });
  if(!hH)hH=`<div style="text-align:center;padding:2rem;font-size:13px;color:#888;">Aucune transaction.</div>`;

  // Export CSV
  const csvRows=['Date,Client,N°,Description,Points,Par'];
  all.forEach(h=>{
    const cn=h.client?`${h.client.prenom} ${h.client.nom}`:'—';
    const cnum=h.client?.num_carte||'—';
    const by=h.by?`${h.by.prenom||''} ${h.by.nom||''}`.trim():'—';
    csvRows.push(`${fmtDateOnly(h.created_at)},${cn},${cnum},${h.label},${h.points},${by}`);
  });
  const csvData=encodeURIComponent(csvRows.join('\n'));

  return `
  <div class="sg">
    <div class="sb2"><div class="sn">${(cl2||[]).length}</div><div class="sl">Clients</div></div>
    <div class="sb2"><div class="sn">${tp}</div><div class="sl">Points${hasF?' (filtrés)':''}</div></div>
    <div class="sb2"><div class="sn">${tr2}</div><div class="sl">Récompenses</div></div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div class="st" style="margin:0;">Filtres</div>
      <a href="data:text/csv;charset=utf-8,${csvData}" download="historique-uno-pizza.csv" class="btn bs">📥 Export CSV</a>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div class="field" style="margin:0;"><label>Client</label><select onchange="hf.cid=this.value;window.showStaff()">${cO}</select></div>
      <div class="field" style="margin:0;"><label>Type</label>
        <select onchange="hf.type=this.value;window.showStaff()">
          <option value="" ${!hf.type?'selected':''}>Tous</option>
          <option value="add" ${hf.type==='add'?'selected':''}>Points ajoutés</option>
          <option value="redeem" ${hf.type==='redeem'?'selected':''}>Récompenses</option>
        </select>
      </div>
      <div class="field" style="margin:0;"><label>Du</label><input type="date" value="${hf.df}" onchange="hf.df=this.value;window.showStaff()"/></div>
      <div class="field" style="margin:0;"><label>Au</label><input type="date" value="${hf.dt}" onchange="hf.dt=this.value;window.showStaff()"/></div>
    </div>
    ${hasF?`<button class="btn bs" onclick="hf={cid:'',df:'',dt:'',type:''};window.showStaff()">✕ Réinitialiser</button>`:''}
  </div>
  <div class="card"><div class="st">${all.length} transaction(s)</div>${hH}</div>`;
}

        <div style="text-align:left;">

// ACTIONS
async function createCl(){
  const p=document.getElementById('acp').value.trim(),n=document.getElementById('acn').value.trim();
  const t=document.getElementById('act').value.trim(),a=document.getElementById('aca').value.trim();
  const nv=document.getElementById('acnum').value.trim();
  if(!p||!n){toast('Prénom et nom requis');return;}
  if(!nv){toast('Numéro de carte requis');return;}
  const num=parseInt(nv).toString();
  const{data:ex}=await sb.from('users').select('id').eq('num_carte',num).maybeSingle();
  if(ex){toast('❌ Ce numéro existe déjà !');return;}
  const{error}=await sb.from('users').insert({role:'client',login:num,password:num,prenom:p,nom:n,telephone:t,adresse:a,num_carte:num,points:0,reward1_used:false,reward2_used:false});
  if(error){toast('Erreur : '+error.message);return;}
  toast('✅ '+p+' '+n+' créé — carte '+num);showCC=false;await loadCl();showStaff();
}

async function delCl(id){
  if(!confirm('Supprimer ce client ?'))return;
  await sb.from('transactions').delete().eq('client_id',id);
  await sb.from('users').delete().eq('id',id);
  if(selId===id)selId=null;
  toast('Client supprimé');await loadCl();showStaff();
}

async function addPts(cid){
  const val=parseInt(document.getElementById('pts-in').value);
  if(!val||val<1){toast('Montant invalide');return;}
  if(session.role==='moderateur'&&!isOpen()){toast('❌ Restaurant fermé — ajout impossible.',4000);return;}
  const{data:c}=await sb.from('users').select('points,prenom,nom').eq('id',cid).single();
  await sb.from('users').update({points:(c.points||0)+val}).eq('id',cid);
  await sb.from('transactions').insert({client_id:cid,by_user_id:session.id,label:'Commande '+val+'€',points:val});
  showPtsAnim(val,c.prenom+' '+c.nom);
  await loadCl();showStaff();
}

async function redeem(cid,cost,label){
  if(!confirm('Utiliser "'+label+'" pour ce client ?'))return;
  const{data:c}=await sb.from('users').select('points,reward1_used,reward2_used').eq('id',cid).single();
  const isR1=cost===125,isR2=cost===250;
  if(isR1&&c.reward1_used){toast('🍾 Bouteille déjà utilisée !');return;}
  if(isR2&&c.reward2_used){toast('🍕 Pizza déjà utilisée !');return;}
  if(c.points<cost){toast('Points insuffisants');return;}
  const upd=isR1?{reward1_used:true}:{reward2_used:true};
  const bothUsed=(isR1&&c.reward2_used)||(isR2&&c.reward1_used);
  if(bothUsed){upd.points=0;upd.reward1_used=false;upd.reward2_used=false;}
  await sb.from('users').update(upd).eq('id',cid);
  await sb.from('transactions').insert({client_id:cid,by_user_id:session.id,label:label,points:0});
  if(bothUsed)toast('🎉 Les deux récompenses utilisées ! Points remis à zéro.',4000);
  else toast(label+' utilisé !');
  await loadCl();showStaff();
}

async function saveCl(id){
  const p=document.getElementById('ep').value.trim(),n=document.getElementById('en').value.trim();
  const t=document.getElementById('et').value.trim(),a=document.getElementById('ea').value.trim();
  const nv=document.getElementById('enum').value.trim();
  if(!p||!n){toast('Prénom et nom requis');return;}
  const num=nv?parseInt(nv).toString():null;
  const upd={prenom:p,nom:n,telephone:t,adresse:a};
  if(num){upd.num_carte=num;upd.login=num;}
  const{error}=await sb.from('users').update(upd).eq('id',id);
  if(error){toast('Erreur : '+error.message);return;}
  toast('✅ Client mis à jour !');await loadCl();showStaff();
}

async function createMod(){
  const p=document.getElementById('amp').value.trim(),n=document.getElementById('amn').value.trim();
  const l=document.getElementById('aml').value.trim(),pw=document.getElementById('ampw').value.trim();
  if(!p||!n||!l||!pw){toast('Tous les champs requis');return;}
  const{error}=await sb.from('users').insert({role:'moderateur',login:l,password:pw,prenom:p,nom:n});
  if(error){toast('Erreur : '+error.message);return;}
  toast('Modérateur '+p+' '+n+' créé');showCM=false;showStaff();
}

async function delMod(id){
  if(!confirm('Supprimer ce modérateur ?'))return;
  await sb.from('users').delete().eq('id',id);
  toast('Modérateur supprimé');showStaff();
}
