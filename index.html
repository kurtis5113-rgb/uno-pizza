<script>
(function(){
  var cdns = [
    'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.3/umd/supabase.min.js',

    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js'
  ];
  var i = 0;
  function tryLoad(){
    if(i >= cdns.length){ document.getElementById('root').innerHTML='<div style="padding:3rem;text-align:center;color:#666;">Vérifiez votre connexion internet et rechargez la page.</div>'; return; }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function(){ initApp(); };
    s.onerror = function(){ tryLoad(); };
    document.head.appendChild(s);
  }
  tryLoad();
})();

function initApp(){



const SURL = 'https://wbdnfjwpcimkjygokkzc.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiZG5mandwY2lta2p5Z29ra3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1OTg3MzYsImV4cCI6MjA5MTE3NDczNn0.d6_A3R_ko3nfzkvJbSyMS1zi8YQmkkrL4HpbXEiI_d4';
const sb = supabase.createClient(SURL, SKEY);

let session = null, view = 'clients', selId = null, showCC = false, showCM = false;
let hf = {cid:'', df:'', dt:'', type:''};
let clients = [];

// UTILS
function toast(m,d=2500){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',d);}
function ini(p,n){return((p||'')[0]||'').toUpperCase()+((n||'')[0]||'').toUpperCase()||'?';}
function fmtL(d){return new Date(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtT(d){return new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function avS(r){if(r==='admin')return'background:#FAECE7;color:#993C1D;';if(r==='moderateur')return'background:#eff6ff;color:#1d4ed8;';return'background:#f0fdf4;color:#166534;';}
function nxt(cl){const ns=cl.map(c=>parseInt((c.num_carte||'UP-000').split('-')[1]||0));return'UP-'+((ns.length?Math.max(...ns):0)+1).toString().padStart(3,'0');}
function grp(txs){const g={};(txs||[]).forEach(t=>{const k=t.created_at.split('T')[0];if(!g[k])g[k]=[];g[k].push(t);});return g;}
function isOpen(){const n=new Date(),d=n.getDay(),h=n.getHours()+n.getMinutes()/60;const s={0:[[11,14],[18,22.5]],1:null,2:[[11,14],[18,22]],3:[[11,14],[18,22]],4:[[11,14],[18,22]],5:[[11,14],[18,22.5]],6:[[11,14],[18,22.5]]};const p=s[d];if(!p)return false;return p.some(([a,b])=>h>=a&&h<b);}
function render(h){document.getElementById('root').innerHTML=h;}
async function loadCl(){const{data}=await sb.from('users').select('*').eq('role','client').order('nom');clients=data||[];}

// AUTO LOGOUT
const TM=60*60*1000;let lt,wt;
function resetT(){if(!session)return;clearTimeout(lt);clearTimeout(wt);wt=setTimeout(()=>{if(session)toast('⚠️ Déconnexion dans 5 min...',6000);},TM-300000);lt=setTimeout(()=>{if(session){session=null;stopT();showLogin();setTimeout(()=>toast('🔒 Déconnecté après 30 min.'),300);}},TM);}
function stopT(){clearTimeout(lt);clearTimeout(wt);}
['click','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,()=>{if(session)resetT();},{passive:true}));

// SEARCH MODAL — event listeners après chargement DOM
document.getElementById('btn-close-search').onclick = () => closeSM();
document.getElementById('btn-create-from-search').onclick = () => { closeSM(); showCC=true; view='clients'; showStaff(); };
document.getElementById('search-input').oninput = function(){ doSearch(this.value); };

function openSM(){
  document.getElementById('sm').classList.add('open');
  const inp = document.getElementById('search-input');
  inp.value = '';
  doSearch('');
  setTimeout(()=>inp.focus(), 150);
}
function closeSM(){ document.getElementById('sm').classList.remove('open'); }

async function doSearch(q){
  const query = q.toLowerCase().trim();
  const res = query ? clients.filter(c=>(c.prenom+' '+c.nom+' '+(c.num_carte||'')+' '+(c.telephone||'')).toLowerCase().includes(query)) : clients.slice(0,8);
  const cont = document.getElementById('search-results');
  if(!cont) return;
  if(res.length===0){cont.innerHTML=`<div style="text-align:center;padding:1.5rem;color:#9ca3af;font-size:13px;">Aucun client trouvé.</div>`;return;}
  cont.innerHTML = res.map(c=>`
    <div class="si" onclick="pickClient('${c.id}')">
      <div class="av" style="${avS('client')}">${ini(c.prenom,c.nom)}</div>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">${c.prenom} ${c.nom}</div>
        <div style="font-size:12px;color:#9ca3af;">${c.num_carte||'—'} · ${c.telephone||'—'} · <b style="color:var(--brand);">${c.points} pts</b></div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>`).join('');
}

async function pickClient(id){ closeSM(); selId=id; view='clients'; await showStaff(); }

  stopT(); session=null; selId=null; showCC=false; showCM=false;
  render(`

      <div class="lb"><h1><span class="u">Uno</span> <span class="p">Pizza</span></h1></div>
      <div class="lg2">★ Programme de fidélité · Depuis 2017</div>

        <div class="lt">
          <button class="lta active" id="tab-s" onclick="switchTab('s')">Staff</button>
          <button class="lta" id="tab-c" onclick="switchTab('c')">Client</button>
          <button class="lta" id="tab-r" onclick="switchTab('r')">Créer un compte</button>
        </div>
        <div id="lbody"></div>
      </div>
    </div>
  </div>`);
  switchTab('s');
}

function switchTab(tab){
  document.querySelectorAll('.lta').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  const b = document.getElementById('lbody');
  if(tab==='s'){
    b.innerHTML=`<div id="la"></div>
    <div class="field"><label>Identifiant</label><input id="li" autocorrect="off" autocapitalize="off" placeholder="admin"/></div>
    <div class="field"><label>Mot de passe</label><input id="lp" type="password" placeholder="••••••"/></div>
    <button class="btn bp bf" onclick="doLS()">Se connecter</button>`;
    document.getElementById('li').addEventListener('keydown',e=>{if(e.key==='Enter')doLS();});
    document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLS();});
  } else if(tab==='c'){
    b.innerHTML=`<div id="la"></div>
    <div class="field"><label>Numéro de carte (ex: UP-001)</label><input id="li" type="number" placeholder="Ex: 4" autocorrect="off"/></div>
    <div class="field"><label>Mot de passe</label><input id="lp" type="password" placeholder="••••••"/></div>
    <button class="btn bp bf" onclick="doLC()">Se connecter</button>`;
    document.getElementById('li').addEventListener('keydown',e=>{if(e.key==='Enter')doLC();});
    document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLC();});
  } else {
    b.innerHTML=`<div id="la"></div>
    <p>Votre numéro de carte vous est fourni par le restaurant.</p>
    <div class="g2">
      <div class="field"><label>Prénom</label><input id="rp"/></div>
      <div class="field"><label>Nom</label><input id="rn"/></div>
    </div>
    <div class="field"><label>Téléphone</label><input id="rt" placeholder="06 12 34 56 78"/></div>
    <div class="field"><label>Adresse</label><input id="ra"/></div>
    <div class="field"><label>Numéro de carte (chiffres uniquement)</label>
      <div style="display:flex;">
        <span style="height:40px;display:flex;align-items:center;padding:0 10px;background:#f3f4f6;border:1px solid #d1d5db;border-right:none;border-radius:var(--rs) 0 0 var(--rs);font-size:14px;font-weight:700;color:var(--brand);">UP-</span>
        <input id="rc" type="number" min="1" max="9999" placeholder="001" style="border-radius:0 var(--rs) var(--rs) 0;"/>
      </div>
    </div>
    <div class="field"><label>Mot de passe</label><input id="rpw" type="password" placeholder="••••••"/></div>
    <button class="btn bp bf" onclick="doReg()">Créer mon compte</button>`;
  }
}

async function doLS(){
  const l=document.getElementById('li').value.trim();
  const p=document.getElementById('lp').value.trim();
  const al=document.getElementById('la');
  if(!l||!p){al.innerHTML=`<div class="al ae">Veuillez remplir tous les champs.</div>`;return;}
  al.innerHTML=`<div class="al ai">⏳ Connexion en cours...</div>`;
  try{
    const{data,error}=await sb.from('users').select('*').eq('login',l).in('role',['admin','moderateur']);
    if(error)throw error;
    if(!data||data.length===0){al.innerHTML=`<div class="al ae">❌ Identifiant introuvable.</div>`;return;}
    const user=data.find(u=>u.password===p);
    if(!user){al.innerHTML=`<div class="al ae">❌ Mot de passe incorrect.</div>`;return;}
    session=user; resetT(); await loadCl(); showStaff(); openSM();
  }catch(e){al.innerHTML=`<div class="al ae">❌ Erreur : ${e.message}</div>`;}
}

async function doLC(){
  const raw=document.getElementById('li').value.trim();
  const p=document.getElementById('lp').value.trim();
  const al=document.getElementById('la');
  if(!raw||!p){al.innerHTML=`<div class="al ae">Veuillez remplir tous les champs.</div>`;return;}
  // Accepte "4" ou "UP-004" ou "004"
  const n = raw.toUpperCase().startsWith('UP-') ? raw.toUpperCase() : 'UP-'+String(parseInt(raw)).padStart(3,'0');
  al.innerHTML=`<div class="al ai">⏳ Connexion en cours...</div>`;
  try{
    const{data,error}=await sb.from('users').select('*').eq('num_carte',n).eq('role','client');
    if(error)throw error;
    if(!data||data.length===0){al.innerHTML=`<div class="al ae">❌ Numéro de carte introuvable.</div>`;return;}
    // Mdp = chiffre simple (ex: 4) ou mdp complet
    const rawPass = p;
    const formattedPass = 'UP-'+String(parseInt(p)).padStart(3,'0');
    const user=data.find(u=>u.password===rawPass||u.password===formattedPass||u.password===n);
    if(!user){al.innerHTML=`<div class="al ae">❌ Mot de passe incorrect.</div>`;return;}
    session=user; resetT(); showCS();
  }catch(e){al.innerHTML=`<div class="al ae">❌ Erreur : ${e.message}</div>`;}
}

async function doReg(){
  const p=document.getElementById('rp').value.trim(),n=document.getElementById('rn').value.trim();
  const t=document.getElementById('rt').value.trim(),a=document.getElementById('ra').value.trim();
  const cv=document.getElementById('rc').value.trim(),pw=document.getElementById('rpw').value.trim();
  const al=document.getElementById('la');
  if(!p||!n||!t||!a||!cv||!pw){al.innerHTML=`<div class="al ae">Tous les champs sont requis.</div>`;return;}
  const nc='UP-'+String(parseInt(cv)).padStart(3,'0');
  const{data:ex}=await sb.from('users').select('id').eq('num_carte',nc).maybeSingle();
  if(ex){al.innerHTML=`<div class="al ae">Ce numéro de carte est déjà utilisé.</div>`;return;}
  const{error}=await sb.from('users').insert({role:'client',login:nc,password:pw,prenom:p,nom:n,telephone:t,adresse:a,num_carte:nc,points:0});
  if(error){al.innerHTML=`<div class="al ae">Erreur : ${error.message}</div>`;return;}
  al.innerHTML=`<div class="al as">✅ Compte créé ! Connectez-vous avec votre numéro de carte.</div>`;
  setTimeout(()=>switchTab('c'),2000);
}

// HISTORY
async function rHist(){
  const{data:cl2}=await sb.from('users').select('*').eq('role','client');

  if(hf.type==='add')q=q.gt('points',0);
  if(hf.type==='redeem')q=q.lt('points',0);
  const{data:txs}=await q;

        ${c.reward1_used?`<span class="badge" style="background:#f0fdf4;color:#166534;">✅ Réclamée</span>`:c.points>=125?`<span class="badge ba">Disponible !</span>`:''}
      </div>
      <div class="rr${c.points>=250?' ul':''}">
        <div class="ri">🍕</div>
        <div style="flex:1;"><div style="font-weight:600;font-size:14px;">Pizza Junior au choix offerte</div>
        <div class="pw"><div class="pf" style="width:${Math.min(100,(c.points/250)*100)}%"></div></div>
        <div style="font-size:12px;color:#6b7280;">${p2}/250 pts</div></div>
        ${c.reward2_used?`<span class="badge" style="background:#f0fdf4;color:#166534;">✅ Réclamée</span>`:c.points>=250?`<span class="badge ba">Disponible !</span>`:''}
      </div>
    </div>
    <div class="card"><div class="st">Mon historique</div>${hH}</div>
  </div>`);
}

// ACTIONS
async function createCl(num){
  const p=document.getElementById('acp').value.trim(),n=document.getElementById('acn').value.trim();
  const t=document.getElementById('act').value.trim(),a=document.getElementById('aca').value.trim();
  const pw=document.getElementById('acpw').value.trim()||num;
  if(!p||!n){toast('Prénom et nom requis');return;}
  const{error}=await sb.from('users').insert({role:'client',login:num,password:pw,prenom:p,nom:n,telephone:t,adresse:a,num_carte:num,points:0});
  if(error){toast('Erreur : '+error.message);return;}
  toast('✅ '+p+' '+n+' créé — carte '+num);showCC=false;await loadCl();showStaff();
}

async function delCl(id){
  if(!confirm('Supprimer ce client ?'))return;
  await sb.from('transactions').delete().eq('client_id',id);
  await sb.from('users').delete().eq('id',id);
  if(selId===id)selId=null;
  toast('Client supprimé');await loadCl();showStaff();
}

async function addPts(cid){
  const val=parseInt(document.getElementById('pts-in').value);
  if(!val||val<1){toast('Montant invalide');return;}
  if(session.role==='moderateur'&&!isOpen()){toast('❌ Restaurant fermé — ajout impossible.',4000);return;}
  const{data:c}=await sb.from('users').select('points').eq('id',cid).single();
  await sb.from('users').update({points:(c.points||0)+val}).eq('id',cid);
  await sb.from('transactions').insert({client_id:cid,by_user_id:session.id,label:'Commande '+val+'€',points:val});
  toast('+'+val+' points ajoutés !');await loadCl();showStaff();
}

async function redeem(cid,cost,label){
  if(!confirm('Utiliser "'+label+'" ?'))return;
  const{data:c}=await sb.from('users').select('points,reward1_used,reward2_used').eq('id',cid).single();
  
  // Vérifier quelle récompense on utilise
  const isReward1 = cost === 125;
  const isReward2 = cost === 250;
  
  if(isReward1 && c.reward1_used){ toast('🍾 Bouteille déjà utilisée !'); return; }
  if(isReward2 && c.reward2_used){ toast('🍕 Pizza déjà utilisée !'); return; }
  if(c.points < cost){ toast('Points insuffisants'); return; }
  
  // Marquer la récompense comme utilisée sans déduire les points
  const upd = isReward1 ? {reward1_used: true} : {reward2_used: true};
  
  // Si les deux récompenses sont utilisées → reset à zéro
  const bothUsed = (isReward1 && c.reward2_used) || (isReward2 && c.reward1_used);
  if(bothUsed){ upd.points = 0; upd.reward1_used = false; upd.reward2_used = false; }
  
  await sb.from('users').update(upd).eq('id',cid);
  await sb.from('transactions').insert({client_id:cid,by_user_id:session.id,label:label,points: bothUsed ? -(cost) : 0});
  
  if(bothUsed){ toast('🎉 Les deux récompenses utilisées ! Points remis à zéro.', 4000); }
  else { toast(label+' utilisé !'); }
  await loadCl(); showStaff();
}

async function saveCl(id){
  const p=document.getElementById('ep').value.trim(),n=document.getElementById('en').value.trim();
  const t=document.getElementById('et').value.trim(),a=document.getElementById('ea').value.trim();
  const nv=document.getElementById('enum').value.trim(),pw=document.getElementById('epw').value.trim();
  if(!p||!n){toast('Prénom et nom requis');return;}
  const nc=nv?'UP-'+String(parseInt(nv)).padStart(3,'0'):null;
  const upd={prenom:p,nom:n,telephone:t,adresse:a};
  if(nc){upd.num_carte=nc;upd.login=nc;}
  if(pw)upd.password=pw;
  const{error}=await sb.from('users').update(upd).eq('id',id);
  if(error){toast('Erreur : '+error.message);return;}
  toast('✅ Client mis à jour !');await loadCl();showStaff();
}

// Masquer téléphone et extraire ville
function maskPhone(p){
  if(!p||p.length<6) return p;
  const d=p.replace(/ /g,'');
  if(d.length>=10) return d.slice(0,2)+'** *** **'+d.slice(-2);
  return p.slice(0,2)+'***'+p.slice(-2);
}
function extractCity(adr){
  if(!adr) return '';
  // Prendre le dernier segment après la virgule ou le dernier mot
  const parts = adr.split(',');
  const last = parts[parts.length-1].trim();
  // Enlever le code postal (5 chiffres au début)
  return last.replace(/^\d{5}\s*/,'');
}
